[package]
name = "tauri-app-template"
version = "0.1.0"
description = "A Tauri App"
authors = ["RandomlyZay"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/RandomlyZay-Labs/tauri-app-template"
edition = "2024"
default-run = "tauri-app-template"

[lib]
name = "tauri_app_template_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "tauri-app-template"
path = "src/main.rs"

[[bin]]
name = "tauri-app-template-cli"
path = "src/bin.rs"

[dependencies]
# --- Tauri ---
tauri = { version = "2", features = ["tray-icon", "devtools"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
tauri-plugin-better-posthog = "0.1"

# --- CLI & Argument Parsing ---
clap = { version = "4", features = ["derive"] }
dirs = "6"

# --- Specta (Typescript Generation) ---
specta = { version = "=2.0.0-rc.22", features = ["serde", "serde_json"] }
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
specta-typescript = "=0.0.9"

# --- Async & Runtime ---
futures-util = "0.3"
reqwest = { version = "0.13", features = ["charset", "http2", "native-tls", "stream"], default-features = false }
tokio = { version = "1", features = ["sync", "fs", "macros"] }
tokio-util = { version = "0.7", features = ["io"] }

# --- Data, Serialization, & DB ---
better-posthog = "0.2"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "sqlite", "chrono", "macros", "migrate"] }

# --- Utilities & Logging ---
dotenvy = "0.15"
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs" }
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
log = "0.4"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
notify = "8"
notify-debouncer-mini = "0.7"
async-trait = "0.1.89"
bytes = "1.11.1"
wait-timeout = "0.2.1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.dev.package."*"]
opt-level = 3
debug = false

[dev-dependencies]
tempfile = "3.27.0"
tauri = { version = "2", features = ["test"] }
mockito = "1.7.2"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
